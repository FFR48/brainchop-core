name: build and test

# Cross-platform build and bit-exact CPU regression suite across macOS, Linux
# (GCC and Clang), Windows (MSYS2 UCRT64), ThreadSanitizer, UBSan, toolkit-free
# CUDA Driver API packaging, and pure-JS WebGPU V4 unit tests.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
    inputs:
      cuda_only:
        description: 'Run only toolkit-free Linux/Windows distribution checks'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  js-unit:
    if: ${{ !inputs.cuda_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'js/package-lock.json'
      - name: Build WebGPU V4 bundle and run JS unit tests
        working-directory: js
        run: |
          npm ci
          npm run build:webgpu
          npm run test:unit

  macos:
    if: ${{ !inputs.cuda_only }}
    # Apple Silicon runner (macos-15).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # No dependency step: threading is pthreads, which macOS has in libSystem.
      - name: Build
        # METAL=1 is the default here, so this also compiles backend_metal.mm
        # and the selected model's generated Metal header -- compile coverage
        # for the GPU path even though the runner cannot execute it.
        run: make -C src -j3 all
      - name: Test
        # CPU only. GitHub-hosted macOS runners are virtualized and do not offer
        # dependable Metal GPU access, so `make test-metal` is deliberately not
        # run here: it would either fail spuriously or pass without testing
        # anything, and a test that cannot fail is worse than no test.
        run: make -C src test

  linux:
    if: ${{ !inputs.cuda_only }}
    runs-on: ubuntu-latest
    # Both compilers, because the bit-exactness assertion is what this job is
    # for and it is a property of the COMPILER, not just the platform. gcc is
    # the one that differs from the macOS job (which is clang), so it is the
    # real cross-check; clang here shares a compiler with macOS but not an
    # architecture, so it separates "arm64 vs x86-64" from "clang vs gcc".
    #
    # Both were verified bit-exact by hand on x86-64 -- gcc 13.3 and clang
    # 18.1.3 -- against fixtures generated by Apple clang on arm64, so this
    # matrix is recording a checked fact rather than hoping.
    #
    # fail-fast off: if one compiler diverges, the interesting information is
    # whether the other did too, and cancelling hides exactly that.
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # pthreads is in libc for both compilers, so neither leg needs a
        # threading package. CC is passed explicitly, and that is the only thing
        # keeping the two legs distinct -- without it both would resolve to the
        # same compiler and the matrix would cover one twice.
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Build
        # No Metal, no CUDA toolkit and no OpenCL ICD on this runner, so this is
        # the plain pthread CPU build.
        run: make -C src -j3 all METAL=0 CUDA=0 OPENCL=0 CC=${{ matrix.cc }}
      - name: Test
        run: make -C src test METAL=0 CUDA=0 OPENCL=0 CC=${{ matrix.cc }}

  windows:
    if: ${{ !inputs.cuda_only }}
    # CPU only: hosted runners have no GPU, so test-cuda / test-opencl stay manual.
    #
    # clang + lld, not gcc, because that is what the Makefile's CC probe picks
    # on a developer's UCRT64 and it is the configuration that broke: three test
    # links omitted $(LDFLAGS), so -flto bitcode reached GNU ld without
    # -fuse-ld=lld. A gcc leg would not have seen it.
    #
    # node + brainchop-test so the browser-oracle gates RUN rather than skip.
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # .gitattributes pins eol=lf for this repo so Git for Windows preserves LF.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned: the oracle is upstream code, and its HEAD moving must not change
      # what this job asserts.
      - uses: actions/checkout@v4
        with:
          repository: neuroneural/brainchop-test
          ref: 59a79eea05ddd08070d0dba17120debedf0b4790
          path: brainchop-test
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-nodejs
      - name: Oracle dependencies
        run: cd brainchop-test && npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: make -C src -j4 all CUDA=0 OPENCL=0
      - name: Test
        # The default is a SIBLING of the repo (../../brainchop-test from src/),
        # but checkout paths must stay inside the workspace. Relative, because
        # $GITHUB_WORKSPACE is a backslashed D:\ path here.
        run: make -C src test CUDA=0 OPENCL=0 BC_BRAINCHOP_TEST=../brainchop-test
      - name: Serial build, bit-exact
        # The THREADS=0 fallback: no pool, same fixtures. Slow (one core, every
        # model), which is why it is a step of its own rather than part of Test.
        run: |
          make -C src -j4 models THREADS=0 CUDA=0 OPENCL=0
          make -C src test-models THREADS=0 CUDA=0 OPENCL=0

  tsan-threads:
    if: ${{ !inputs.cuda_only }}
    # The thread pool's own gate. Unlike ubsan/asan below it builds the pool
    # THREADED -- it exists to test threading, not to avoid it -- and compiles
    # only the pool plus a small harness, so it finishes in seconds rather than
    # half an hour. That is why it rides on the fast path.
    #
    # Note it does not read the THREADS variable at all: the recipe hardcodes
    # -DBC_THREADS on its own compile line, so passing THREADS=0 would not make
    # it serial.
    #
    # Ubuntu's clang carries the TSan runtime; no extra package is needed.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: ThreadSanitizer over bc_parallel_for
        # Asserts both directions: index-disjoint writes must come back clean,
        # and a deliberately planted race MUST be caught. The second is what
        # makes the first mean anything -- if it passes, the gate is not armed.
        run: make -C src tsan-threads CC=clang

  ubsan:
    if: ${{ !inputs.cuda_only }}
    # Separate job: the sanitizer build is -O1 and THREADS=0, so a 256^3 MeshNet
    # runs serial and takes far longer than the optimized jobs. Kept off the
    # critical path rather than slowing every push. This is also where UBSan
    # actually gets run -- it is impractically slow on a developer Mac, so the
    # macOS side is not expected to run it by hand.
    #
    # Budget: >15 min per model on an Apple M4 Pro, so allow well beyond that on
    # a hosted runner. The explicit limit is so a hang fails visibly instead of
    # burning the 6-hour default.
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Build with -fsanitize=undefined
        run: make -C src ubsan
      - name: Run both models under UBSan
        # -fno-sanitize-recover=all means any undefined behaviour aborts, so a
        # nonzero exit here is a real finding, not a warning to triage. One
        # executable per model, so each is invoked by its own name; `-m` and the
        # multi-model binary no longer exist.
        run: |
          cd src
          ./brainchop-mindgrab -cpu 0 --no-turbo -o /tmp/ubsan-mindgrab.nii.gz ../test/t1_2mm.nii.gz
          ./brainchop-mindmap-fast -cpu 0 -o /tmp/ubsan-model16.nii.gz ../test/t1_2mm.nii.gz

  cuda-distribution:
    runs-on: ${{ matrix.os }}
    # Full bit-exact `make test` (~90 s per model run) plus packaging.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev python3 binutils
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: minimal
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
      - name: Toolkit-free Linux build and package
        if: runner.os == 'Linux'
        run: bash scripts/test_cuda_distribution.sh
      - name: Toolkit-free Windows build and package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/test_cuda_distribution.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-driver-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
